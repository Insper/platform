name: ci
on:
  - push
  - pull_request
  
# Environment
env:
  CI: true

# Jobs to run
jobs:
     
  # Build and deploy documentation site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Checkout source form GitHub
      - uses: actions/checkout@v4

      # Install uv; it installs the Python of .python-version (3.12) by itself
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # Dependencies exactly as in uv.lock
      - run: uv sync --frozen

      # 2027.1 hands-on: cumulative BoxOffice zips (boxoffice-after-lab-<n>.zip), not committed
      - run: uv run scripts/handouts/snapshots.py

      # build: English (default) into site/, Brazilian Portuguese into site/pt/
      - run: uv run zensical-i18n build --clean

      # deploy (Zensical has no gh-deploy: publish site/ to the gh-pages branch)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
