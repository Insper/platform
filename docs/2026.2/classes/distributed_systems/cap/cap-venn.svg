<svg class="cap-venn" viewBox="0 0 640 560" role="img" aria-labelledby="cap-venn-title cap-venn-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="cap-venn-title">CAP theorem</title>
  <desc id="cap-venn-desc">Three overlapping circles: Consistency, Availability and Partition tolerance. The overlaps are CP and AP, the two real choices, and CA, which only exists without partitions. The centre, all three at once, is impossible.</desc>
  <circle class="ring c" cx="320" cy="190" r="150"/>
  <circle class="ring a" cx="233" cy="340" r="150"/>
  <circle class="ring p" cx="407" cy="340" r="150"/>
  <text class="name" x="320" y="95" text-anchor="middle">Consistency</text>
  <text class="def" x="320" y="118" text-anchor="middle">every read sees the latest write</text>
  <text class="name" x="160" y="420" text-anchor="middle">Availability</text>
  <text class="def" x="160" y="443" text-anchor="middle">every request gets</text>
  <text class="def" x="160" y="461" text-anchor="middle">a non-error answer</text>
  <text class="name" x="480" y="405" text-anchor="middle">Partition</text>
  <text class="name" x="480" y="431" text-anchor="middle">tolerance</text>
  <text class="def" x="480" y="453" text-anchor="middle">works while the</text>
  <text class="def" x="480" y="471" text-anchor="middle">network is split</text>
  <text class="pair" x="395" y="236" text-anchor="middle">CP</text>
  <text class="ex" x="395" y="257" text-anchor="middle">ZooKeeper, etcd</text>
  <text class="pair" x="320" y="386" text-anchor="middle">AP</text>
  <text class="ex" x="320" y="404" text-anchor="middle">Cassandra, DNS</text>
  <text class="pair ca" x="245" y="236" text-anchor="middle">CA</text>
  <text class="ex ca" x="245" y="257" text-anchor="middle">no partitions</text>
  <text class="ex ca" x="245" y="273" text-anchor="middle">(single node)</text>
  <circle class="none" cx="320" cy="292" r="15"/>
  <path class="none-x" d="M313 285 L327 299 M327 285 L313 299"/>
  <text class="ex none-t" x="320" y="324" text-anchor="middle">all three:</text>
  <text class="ex none-t" x="320" y="339" text-anchor="middle">impossible</text>
  <text class="foot" x="320" y="535" text-anchor="middle">Partitions will happen, so the real choice is CP or AP — during a partition.</text>
</svg>
