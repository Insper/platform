server:
  port: 8086

spring:
  application:
    name: notification
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:boxoffice}?currentSchema=notification
    username: ${DB_USER:boxoffice}
    password: ${DB_PASSWORD:boxoffice}
  flyway:
    schemas: notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      concurrency: ${NOTIFY_CONCURRENCY:3}
  mail:
    host: ${MAIL_HOST:mailpit}
    port: 1025

boxoffice:
  notification:
    email-latency: ${EMAIL_LATENCY:50ms}
    idempotent: ${NOTIFY_IDEMPOTENT:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/liveness and /readiness
