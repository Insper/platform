[project.theme]
variant = "modern"
logo = "assets/images/logo.png"
features = [
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tooltips",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.top",
  "navigation.path",
  "navigation.tracking",
  "navigation.footer",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon.admonition]
note = "fontawesome/solid/note-sticky"
abstract = "fontawesome/solid/book"
info = "fontawesome/solid/circle-info"
tip = "fontawesome/solid/bullhorn"
success = "fontawesome/solid/check"
question = "fontawesome/solid/circle-question"
warning = "fontawesome/solid/triangle-exclamation"
failure = "fontawesome/solid/bomb"
danger = "fontawesome/solid/skull"
bug = "fontawesome/solid/robot"
example = "fontawesome/solid/flask"
quote = "fontawesome/solid/quote-left"

# Follow the operating system preference
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.inlinehilite = {}
pymdownx.snippets.url_download = true
pymdownx.snippets.dedent_subsections = true   # line-range includes ("In the BoxOffice code") start at column 0
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  # Step-by-step diagram simulator (assets/javascripts/mermaid-sim.js)
  { name = "mermaid-sim", class = "mermaid-sim", format = "pymdownx.superfences.fence_code_format" },
  # 2027.1 diagrams, Mermaid syntax drawn by assets/javascripts/diagram.js (static / step by step)
  { name = "diagram", class = "diagram", format = "pymdownx.superfences.fence_code_format" },
  { name = "diagram-sim", class = "diagram-sim", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
footnotes = {}
pymdownx.caret = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tilde = {}
tables = {}
# Terminal animations for blocks preceded by <!-- termynal --> (assets in extra_*)
termynal.prompt_literal_start = ["$", ">"]

[project.plugins]
glightbox = {}
search = {}
minify.minify_html = true
"markdown-exec" = {}
# A pasta de provas NÃO vai para o site: docs/ é publicado em insper.github.io/platform.
# Remova esta entrada depois de aplicar a prova, se quiser divulgá-la.
exclude.glob = [
  "2026.2/exams/*",
  # LaTeX sources of the 2027.1 workbook and cheat sheet
  "2027.1/support/*/fonte/*",
  # Lab code overlays: Markdown files there are repo files (CONVENTIONS.md, ADRs), not site pages
  "2027.1/hands-on/*/code/**/*.md",
  # Slides (Marp): the .src.md is built into the .html next to it (scripts/slides/build.py)
  "*/slides/*.src.md",
]

# Languages (zensical-i18n): English at the site root, Portuguese in /pt/.
# Translations live next to the originals: page.md (English) and page.pt.md.
# Build with `zensical-i18n build`; preview with `zensical-i18n serve --lang pt`.
[project.plugins.i18n]
docs_structure = "suffix"
fallback_to_default = true
reconfigure_theme = true
translate_admonitions = true

[[project.plugins.i18n.languages]]
locale = "en"
name = "🇺🇸 English"
default = true

[[project.plugins.i18n.languages]]
locale = "pt"
name = "🇧🇷 Português"
site_name = "Plataformas, Microsserviços, DevOps e APIs"
untranslated_notice = "Esta página ainda não foi traduzida. Exibindo a versão em {language}."

[project.plugins.i18n.languages.theme]
language = "pt-BR"

