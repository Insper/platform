<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground harness</title>
<!-- Standalone test page for the System Design Playground (no site build needed):
       python3 -m http.server 8765        (from the repository root)
       open http://localhost:8765/scripts/playground/harness.html
     ?lang=pt switches the interface to Portuguese; the "dark" button toggles the slate palette. -->
<script>
  /* cache-busting loader: always the files on disk */
  var V = "?v=" + Date.now();
  document.write('<link rel="stylesheet" href="../../docs/assets/stylesheets/playground.css' + V + '">');
</script>
<style>
  /* minimal stand-ins for the Material variables */
  :root { --md-default-bg-color: #fff; --md-default-fg-color: rgba(0,0,0,.87); --md-default-fg-color--light: rgba(0,0,0,.54);
    --md-default-fg-color--lighter: rgba(0,0,0,.32); --md-default-fg-color--lightest: rgba(0,0,0,.07);
    --md-accent-fg-color: #526cfe; --md-primary-fg-color: #4051b5; --md-code-bg-color: #f5f5f5; }
  [data-md-color-scheme="slate"] { --md-default-bg-color: #1e2129; --md-default-fg-color: rgba(226,228,233,.82); --md-default-fg-color--light: rgba(226,228,233,.56);
    --md-default-fg-color--lighter: rgba(226,228,233,.32); --md-default-fg-color--lightest: rgba(226,228,233,.12);
    --md-accent-fg-color: #8e9cff; --md-code-bg-color: #262a33; }
  body { margin: 0; padding: 1rem 2rem; font-family: system-ui, sans-serif; font-size: 20px; background: var(--md-default-bg-color); color: var(--md-default-fg-color); }
  main { max-width: 1200px; margin: auto; }
  h1, h2 { font-size: 1rem; }
</style>
</head>
<body data-md-color-scheme="default">
<main class="md-typeset">
  <h1>System Design Playground — harness <button id="theme" type="button">dark / light</button></h1>
  <h2>Full mode</h2>
  <div class="sdp" data-scenario="flash-sale" data-mode="full"></div>
  <h2>Compact mode</h2>
  <div class="sdp" data-scenario="cascading-failure" data-mode="compact" data-height="420"></div>
</main>
<script>
  if (/[?&]lang=pt/.test(location.search)) document.documentElement.lang = "pt";
  document.getElementById("theme").onclick = function () {
    var b = document.body; b.setAttribute("data-md-color-scheme", b.getAttribute("data-md-color-scheme") === "slate" ? "default" : "slate");
  };
</script>
<script>
  ["rng", "catalog", "engine", "scenarios", "ui"].forEach(function (f) {
    document.write('<script src="../../docs/assets/javascripts/playground/' + f + '.js' + V + '"><\/script>');
  });
</script>
</body>
</html>
