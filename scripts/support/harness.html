<!doctype html>
<!-- Test page for the 2027.1 support tools, without building the site.
     From the repository root: python3 -m http.server 8766, then open
     http://127.0.0.1:8766/scripts/support/harness.html?tool=map (or tool=cards),
     with &scheme=slate for dark mode and &lang=pt for the Portuguese interface.
     It mimics the parts of a Zensical page the tools use: <html lang>, the
     palette attribute, the Material colour variables and .md-typeset. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support tools harness</title>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.lang = q.get('lang') || 'en';
  window.ARQ_SITE_ROOT = '/docs/';   // lesson links point to the Markdown sources
</script>
<link rel="stylesheet" href="../../docs/assets/stylesheets/support.css">
<style>
  :root, [data-md-color-scheme="default"] {
    --md-default-fg-color: rgba(0, 0, 0, .87); --md-default-fg-color--light: rgba(0, 0, 0, .54);
    --md-default-fg-color--lighter: rgba(0, 0, 0, .32); --md-default-fg-color--lightest: rgba(0, 0, 0, .07);
    --md-default-bg-color: #fff; --md-primary-fg-color: #4051b5; --md-primary-bg-color: #fff;
  }
  [data-md-color-scheme="slate"] {
    --md-default-fg-color: rgba(226, 228, 233, .82); --md-default-fg-color--light: rgba(226, 228, 233, .56);
    --md-default-fg-color--lighter: rgba(226, 228, 233, .32); --md-default-fg-color--lightest: rgba(226, 228, 233, .12);
    --md-default-bg-color: #1e2129; --md-primary-fg-color: #4051b5; --md-primary-bg-color: #fff;
  }
  html { font-size: 125%; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--md-default-bg-color); color: var(--md-default-fg-color); }
  .md-content { max-width: 61rem; margin: 0 auto; padding: 1.2rem .8rem; }
  .md-typeset { font-size: .8rem; line-height: 1.6; }
  .md-typeset a { color: var(--md-primary-fg-color); }
  [data-md-color-scheme="slate"] .md-typeset a { color: #8c9eff; }
</style>
</head>
<body>
<script>document.body.setAttribute('data-md-color-scheme', q.get('scheme') || 'default');</script>
<div class="md-content"><article class="md-typeset">
  <h1 id="title">Support tools harness</h1>
  <div id="slot"></div>
</article></div>
<script>
  const tool = q.get('tool') || 'map';
  document.getElementById('slot').innerHTML = tool === 'cards'
    ? '<div class="dgm" data-dgm="cartas-arq"></div>'
    : '<div class="dgm" data-dgm="mapa-arq" data-title="The concepts of System Architecture and how they connect"></div>';
</script>
<script src="../../docs/assets/javascripts/support/arq-lessons.js"></script>
<script src="../../docs/assets/javascripts/support/dgm.js"></script>
<script src="../../docs/assets/javascripts/support/dgm-mapa-arq.js"></script>
<script src="../../docs/assets/javascripts/support/dgm-cartas-arq.js"></script>
</body>
</html>
