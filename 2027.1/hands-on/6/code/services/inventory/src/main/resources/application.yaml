server:
  port: 8083

spring:
  application:
    name: inventory
  # migrations always go straight to the primary database (not through PgBouncer)
  flyway:
    url: jdbc:postgresql://${DB_MIGRATION_HOST:localhost}:5432/${DB_NAME:boxoffice}
    user: ${DB_USER:boxoffice}
    password: ${DB_PASSWORD:boxoffice}
    schemas: inventory
  mvc:
    problemdetails:
      enabled: true

inventory:
  locking: ${INVENTORY_LOCKING:pessimistic}     # naive | pessimistic | optimistic
  hold-ttl: ${INVENTORY_HOLD_TTL:PT10M}         # a hold expires after 10 minutes
  max-seats-per-hold: 6
  datasource:
    primary:                                    # writes and read-your-writes reads
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boxoffice}
      username: ${DB_USER:boxoffice}
      password: ${DB_PASSWORD:boxoffice}
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: primary
    replica:                                    # @Transactional(readOnly = true) reads
      jdbc-url: jdbc:postgresql://${DB_REPLICA_HOST:localhost}:${DB_REPLICA_PORT:5432}/${DB_NAME:boxoffice}
      username: ${DB_USER:boxoffice}
      password: ${DB_PASSWORD:boxoffice}
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: replica
      read-only: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
